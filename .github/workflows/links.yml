name: Verificar links

on:
  schedule:
    - cron: "23 9 * * 3"   # quartas, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verificar links externos (falha só em 404/410 ou domínio inexistente)
        run: python tools/verificar_links.py
