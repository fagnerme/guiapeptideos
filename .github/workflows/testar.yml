name: Testar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fumaca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Validar contrato da API
        run: python -m unittest tools.test_api
      - name: Abrir páginas no navegador (erros de JS, título, "Item não encontrado", rolagem lateral)
        run: python tools/testar_site.py
