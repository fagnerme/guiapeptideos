name: Atualizar dados ao vivo

on:
  schedule:
    - cron: "17 7 * * 1"   # toda segunda-feira, 07:17 UTC
    # reservas: o cron do GitHub atrasa ou é descartado; o passo "guarda" pula se já houve coleta recente
    - cron: "47 13 * * 1"
    - cron: "17 7 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atualizar.yml"
      - "tools/atualizar.py"
      - "tools/atualizar_chembl.py"
      - "tools/atualizar_dsld.py"

permissions:
  contents: write

# um run por vez: o seguinte espera o anterior terminar, em vez de disputar o commit
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 30
      - name: Guarda (agendamentos de reserva não repetem uma coleta recente)
        id: guarda
        if: github.event_name == 'schedule'
        run: |
          if [ -n "$(git log --since='48 hours ago' --grep='chore: atualiza dados ao vivo' --format=%h -n 1)" ]; then
            echo "Coleta recente encontrada; pulando."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.guarda.outputs.pular != 'true'
        with:
          python-version: "3.12"
      - name: Coletar fontes oficiais (Anvisa, FDA, EMA, Health Canada, ClinicalTrials.gov e PubMed)
        if: steps.guarda.outputs.pular != 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: python tools/atualizar.py
      - name: Instalar Pillow (o Chrome já vem no runner e valida o catálogo nas importações)
        if: steps.guarda.outputs.pular != 'true'
        run: |
          pip install pillow; which google-chrome || true
      - name: Importar peptideos novos do ChEMBL (valida e desfaz se algo falhar)
        if: steps.guarda.outputs.pular != 'true'
        continue-on-error: true
        run: python tools/atualizar_chembl.py
      - name: Suplementos do DSLD/NIH (relatorio, mercado e fichas novas; valida e desfaz se algo falhar)
        if: steps.guarda.outputs.pular != 'true'
        continue-on-error: true
        run: python tools/atualizar_dsld.py --importar --min 300 --limite 10
      - name: Estudos clínicos (doses, via, duração e esquema, traduzidos para português)
        if: steps.guarda.outputs.pular != 'true'
        continue-on-error: true
        run: python tools/coletar_estudos.py
      - name: Gerar cartões, sitemap e service worker
        if: steps.guarda.outputs.pular != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://fagnerme.github.io/guiapeptideos' }}
        run: |
          python tools/gerar_cartoes.py "$SITE_URL"
          python tools/build.py "$SITE_URL"
      - name: Commit se houver mudanças
        if: always() && steps.guarda.outputs.pular != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api dados js/core.js tools/novos tools/relatorio_dsld.md sitemap.xml robots.txt sw.js cards "*.html" fichas comparar
          git diff --staged --quiet || git commit -m "chore: atualiza dados ao vivo"
          # se o main mudou durante o run, só os arquivos gerados podem ficar com a versão deste run;
          # se alguém mexeu num arquivo que não é gerado, aborta para não sobrescrever a edição
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          git diff --name-only "$base" HEAD | sort > /tmp/meus.txt
          git diff --name-only "$base" origin/main | sort > /tmp/remotos.txt
          conflito=$(comm -12 /tmp/meus.txt /tmp/remotos.txt | grep -Ev '^(fichas/|cards/|comparar/)|^(sw\.js|sitemap\.xml)$' || true)
          if [ -n "$conflito" ]; then
            echo "::error::O main recebeu edições em arquivos que a coleta também alterou; a próxima execução refaz:"
            echo "$conflito"
            exit 1
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort; exit 1; }
            git push && exit 0
            sleep 5
          done
          exit 1
